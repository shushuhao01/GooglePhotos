<!DOCTYPE html>

    </div>
    <div class="top-actions" data-page-node-id="pouqfU1PXVLSiYPaXrSFfj">

    </div>
  </header>

  <!-- ===================== 公告横幅 ===================== -->
  <div id="announce-banner" class="announce-banner hidden">
    <span id="announce-text" class="announce-text"></span>
    <button id="announce-close" class="announce-close" title="关闭">×</button>
  </div>

  <nav class="tabs" data-page-node-id="z6hAyFbwb13D7hBwD7ORQ5">
    <button class="tab active" data-tab="images" data-page-node-id="fFp0MCRoymrJOSHKxi1UlO">图片选择</button>
    <button class="tab" data-tab="tasks" data-page-node-id="ReKiXSy20ZlX1IgcBrxAX2">上传任务<span id="task-count-badge" class="count-badge hidden" data-page-node-id="posTN2RpX2tPA7a4DSmUGU"></span></button>

  <!-- ===================== 会员/额度 ===================== -->

      <span id="quota-label" class="quota-label">本月上传额度</span>
      <span id="quota-value" class="quota-value">—</span>
    </div>
    <div class="billing-right">
      <button id="btn-upgrade" class="mini-btn primary">升级</button>
      <button id="btn-billing-login" class="mini-btn">登录</button>

  </div>

      <button id="btn-scan" class="btn primary small" data-page-node-id="SADLj8SWiuQJJ3VJ216BLx">⟳ 扫描图片</button>

        <option value="content" data-page-node-id="52nZYpnSXmcIZf7J9DLFAF">内容图（隐去头像/图标/广告）</option>
        <option value="hd" data-page-node-id="SCekH9oJCgAPMTA9QYdMRL">仅高清候选</option>
        <option value="thumb" data-page-node-id="RBQZ2QF0NEyW2N1SVUgolg">疑似缩略图</option>
        <option value="dup" data-page-node-id="0SQWUXJ7E3irGvFDq87GfR">重复图片</option>

      </select>
      <select id="sel-sort" class="small" title="排序" data-page-node-id="EMlmur2sP8eE0oHf7gpSjv">
        <option value="page" data-page-node-id="kHALjw6273BO6z6oskNimR">页面顺序</option>
        <option value="res-desc" data-page-node-id="i6wG4dPNTawMHkB0J4D2Ej">分辨率 大→小</option>
        <option value="res-asc" data-page-node-id="DeiCbS73xesEs3GJohfCxf">分辨率 小→大</option>
      </select>
      <input id="inp-search" class="small grow" type="search" placeholder="搜索域名/类型…" data-page-node-id="f6qyZAbeyD7YXZehMnVwQn">
    </div>

    <div class="selectbar" data-page-node-id="B5fFCUt855pLa5kDLDdqZX">
      <button class="mini-btn" data-sel="all" data-page-node-id="xCks7TVIvMRwCrFynCx7BN">全选</button>
      <button class="mini-btn" data-sel="none" data-page-node-id="jFjnxDKOCCKXsP3GOVgSCS">清空</button>
      <button class="mini-btn" data-sel="invert" data-page-node-id="mTo44mEj0BZWz5NsU7twGi">反选</button>
      <button class="mini-btn" data-sel="hd" data-page-node-id="EtuDqIsTdjnUXwTSeag3ij">仅高清</button>

      <div class="thumb-toggle" title="缩略图显示方式">
        <button id="thumb-mode-cover" class="active" title="标准缩略图">▧</button>
        <button id="thumb-mode-contain" title="完整比例缩略图">▤</button>
      </div>
      <div class="view-toggle" title="切换视图">
        <button id="view-btn-list" class="active" title="列表视图">☰</button>
        <button id="view-btn-grid" title="网格视图">▦</button>
      </div>

        <button id="btn-upload" class="btn primary" disabled data-page-node-id="3QNndmqqmx3IBPsfARrnyv">上传选中图片</button>
        <button id="btn-upload-one" class="btn" disabled data-page-node-id="zZxr0KlMjUORheXUrttpS4">下载选中</button>
        <button id="btn-download-zip" class="btn zip-btn" disabled title="将选中图片打包为 ZIP 下载" data-page-node-id="downloadZip">ZIP下载</button>
      </div>
      <div class="dock-row">
        <span class="dock-label">上传目标</span>
        <div id="album-dock" class="album-dock" data-page-node-id="uRAlCX2KUqok57DoAFBVYB">
          <select id="album-target" class="small" title="上传目标相册" data-page-node-id="drGew47kkzIoi0SONwYDcf">
            <option value="auto" data-page-node-id="gWN9YBQMfou3BpxvGEVvhK">自动新建相册</option>
            <option value="none" data-page-node-id="2AvvS61M8mFb9CZDAprIlc">放相册库</option>
            <option value="select" data-page-node-id="UEi2PDYZkzEPQ28IaSr3Fu">加入指定相册…</option>
          </select>
          <input id="album-auto-name" class="album-auto-name" type="text" maxlength="200" placeholder="可选名称（留空默认）" title="自动新建相册名称；留空按模板生成" data-page-node-id="autoAlbumNameInput">

      </div>
      <div class="progress-wrap" data-page-node-id="QXQfA8yD8pOLVEfrjGak0b">
        <div class="progress" data-page-node-id="JzG0CVbkkfbMZlp9vpgrcL"><div id="task-progress" class="progress-inner" data-page-node-id="YeG5y6kEz3P4Vp4HNkYQZ7"></div></div>
        <div class="progress-text" id="task-progress-text" data-page-node-id="jFUmPLkAO88q3p6hvn2XcE"></div>
      </div>
      <div class="task-stats" id="task-stats" data-page-node-id="5NrRKsy6c6uH4anCr7bRmj"></div>

      <ul id="task-items" class="task-items" data-page-node-id="KyE6Krdz0pWtXnUSVYBoTa"></ul>

  </section>

    <div class="scanbar" data-page-node-id="wjfo5JgwL6AxaRquQvXDmP">
      <button id="btn-clear-history" class="mini-btn danger" data-page-node-id="ooNmY67BQjuwjrPnqg5ISs">清空历史</button>
      <span id="history-hint" class="hint" data-page-node-id="BNRHUqwnMZhZGQfLQ0CwPn"></span>
    </div>
    <div id="history-empty" class="empty" data-page-node-id="LBAxNd5EkHYAtWo2r5FWiy">暂无历史记录</div>
    <ul id="history-list" class="history-list" data-page-node-id="NKjBpHDx9Y9sKXbCe90XTj"></ul>
  </section>

  <div id="toast" class="toast hidden" data-page-node-id="I2WNUsI4jBSsZgf0ocAg20"></div>
  <div id="upgrade-modal" class="modal-mask hidden" role="dialog" aria-modal="true">
    <div class="upgrade-box">
      <button id="upgrade-close" class="preview-close">×</button>
      <h3 id="upgrade-title">会员升级</h3>
      <div id="upgrade-login" class="upgrade-login">
        <div class="row">
          <input id="billing-email" type="text" placeholder="产品账号邮箱">
        </div>
        <div class="row">
          <input id="billing-password" type="password" placeholder="密码（注册时设置，可留空用开发者登录）">

        <div class="row">
          <button id="btn-billing-do-login" class="mini-btn primary">登录</button>
          <button id="btn-billing-open-options" class="mini-btn">配置后端</button>
        </div>
        <p id="billing-login-msg" class="tip"></p>
      </div>
      <div id="upgrade-plans" class="upgrade-plans hidden">
        <ul id="upgrade-plan-list" class="plan-list"></ul>
        <p id="upgrade-status" class="hint"></p>
      </div>
    </div>

  <div id="image-preview" class="image-preview hidden" role="dialog" aria-modal="true">
    <button id="preview-max" class="preview-max" title="最大化">⛶</button><button id="preview-close" class="preview-close">×</button><button id="preview-prev" class="preview-nav prev">‹</button>
    <img id="preview-image" alt="图片预览"><button id="preview-next" class="preview-nav next">›</button>
    <div class="preview-toolbar"><button id="preview-play" class="mini-btn">▶ 自动播放</button><span id="preview-index"></span></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
